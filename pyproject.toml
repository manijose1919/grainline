[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainline"
version = "1.0.0"
description = "Nesting and material-yield engine for sheet-goods job shops. Free edition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joseph Maniate", email = "manijose1919@gmail.com" }]
keywords = [
    "nesting", "cnc", "cutting-stock", "dxf", "svg", "sheet-metal",
    "laser-cutting", "waterjet", "yield", "cam", "manufacturing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
]

dependencies = [
    "shapely>=2.0,<3.0",
    "numpy>=1.26",
    "ezdxf>=1.1",
    "svgelements>=1.9",
    "pydantic>=2.6,<3.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[project.scripts]
grainline = "grainline.cli.main:app"

[project.urls]
Homepage = "https://github.com/manijose1919/grainline"
Documentation = "https://github.com/manijose1919/grainline#readme"
Issues = "https://github.com/manijose1919/grainline/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grainline*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "free: exercises only the Free-tier core",
    "premium: exercises the Premium module (not present in this build)",
    "pro: exercises the Pro module (not present in this build)",
    "slow: long-running optimisation tests",
]
filterwarnings = ["error::DeprecationWarning:grainline.*"]

[tool.coverage.run]
source = ["src/grainline"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
